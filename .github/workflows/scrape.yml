name: Scheduled scrape

on:
  schedule:
    # Twice daily, off-round minutes so this doesn't land at the same instant
    # as every other "every 12h" job on the internet. Times are UTC.
    - cron: "17 2 * * *"
    - cron: "43 14 * * *"
  workflow_dispatch:
    inputs:
      pages_per_source:
        description: "Pages to scrape per source this run"
        required: false
        default: "15"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scheduled scrape
        env:
          D1_PROXY_URL: ${{ secrets.D1_PROXY_URL }}
          D1_PROXY_AUTH_TOKEN: ${{ secrets.D1_PROXY_AUTH_TOKEN }}
          SCRAPE_PAGES_PER_SOURCE: ${{ github.event.inputs.pages_per_source || '15' }}
        run: python scripts/scheduled_scrape.py
