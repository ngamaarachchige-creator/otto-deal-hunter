name: Scheduled scrape

on:
  schedule:
    # GitHub's own `schedule:` trigger turned out to be unreliable in
    # practice (some slots delayed 1h+, others skipped entirely under
    # platform load — it's documented as best-effort, not guaranteed). The
    # real driver is now the otto-d1-proxy Cloudflare Worker's own Cron
    # Trigger (see cf-worker/wrangler.jsonc, cron "17 * * * *"), which calls
    # this workflow's dispatch API directly and runs on Cloudflare's edge
    # infra independent of GitHub Actions' queue or any of our own devices.
    # This entry is left in as a redundant backup in case that ever breaks.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      pages_per_source:
        description: "Pages to scrape per make per source this run"
        required: false
        default: "20"
      makes_per_run:
        description: "How many makes to rotate through this run"
        required: false
        default: "3"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scheduled scrape
        env:
          D1_PROXY_URL: ${{ secrets.D1_PROXY_URL }}
          D1_PROXY_AUTH_TOKEN: ${{ secrets.D1_PROXY_AUTH_TOKEN }}
          SCRAPE_PAGES_PER_SOURCE: ${{ github.event.inputs.pages_per_source || '20' }}
          SCRAPE_MAKES_PER_RUN: ${{ github.event.inputs.makes_per_run || '3' }}
          SCRAPE_INTERVAL_HOURS: "1"
        run: python scripts/scheduled_scrape.py
